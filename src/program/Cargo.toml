[package]
name = "multivault"
version = "0.1.0"
description = "MultiVault - Blockchain platform for asset tokenization"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "multivault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
pyth-sdk-solana = "0.10.0"
